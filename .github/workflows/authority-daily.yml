name: Daily Authority Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: pnp-authority-daily
  cancel-in-progress: false

env:
  # across the portfolio at daily cadence. 3 still names the incumbents

jobs:
  authority-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google API client
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      # Measured demand has to land HERE, in the only workflow that commits.
      # deploy-distribution.yml ran this ingest successfully - 19 measured T1 rows -
      # but declares `permissions: contents: read` and has no commit step, so every
      # one of those rows was thrown away at job end and the checked-in evidence
      # stayed at three modelled Semrush rows. Ingesting inside the committing
      # workflow is what makes the measurement persist.
      #
      # No credentials: the script leaves the evidence untouched and exits 0, so a
      # fork or a secretless run can never blank measured evidence. Credentials that
      # fail: it exits 1 and this cycle stops rather than publishing against a stale
      # atlas.
      - name: Ingest measured Search Console queries
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: npm run queries:ingest

      - name: Rebuild the query atlas from the ingested evidence
        run: npm run atlas:build

      # Persist the measurement BEFORE the gate runs. A measurement is a fact about
      # the world and is worth keeping even on a day the atlas it feeds is not fit to
      # publish from; gating first would throw the measurement away exactly when it
      # was most needed. Explicit paths only - this step commits evidence, never
      # published pages or queue state.
      - name: Commit the measured demand
        run: |
          git config user.name "pnp-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/queries/evidence/evidence_queries.json data/authority_scale/query_atlas.json
          if git diff --cached --quiet; then
            echo "NAMED STOP: Search Console returned no change to measured evidence; nothing to commit."
          else
            git commit -m "chore: ingest measured Search Console demand"
            git push
          fi

      # Now the gate. validate:query-atlas is what stops a query rejected for this
      # business - the tent/venue/event-rental rows, which are the wrong business for
      # a porch-decor and event-styling company - from reaching anything publishable.
      - name: Gate the query atlas
        run: npm run validate:query-atlas

      - name: Run governed authority cycle
        run: |
          export AUTHORITY_RUN_DATE="$(date -u +%F)"
          npm run authority:scale:fanout
          npm run authority:improvements:build
          npm run authority:yield:build
          npm run authority:publish
          npm run build:sitemap
          npm run authority:scale:admit
          npm run authority:scale:freeze
          npm run authority:territories:build
          npm run distribution:prepare
          npm run validate:release

      - name: Observe whether answer engines cite us
        # The probe shipped in seven repos and was invoked by none, so no
        # citation observation was ever taken. Grounded mode reads the pages
        # the answer was actually built from; knowledge mode would only show
        # whether a model memorised the brand, which is not a citation.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: node scripts/llm_citation_probe.mjs --limit 25
      # The cadence gate runs before anything is committed, so a cycle that
      # published faster than the cap allows fails here and its pages never
      # land. Only a cleared gate reaches the accept step below.
      - name: Cadence gate
        run: npm run cadence:gate

      # Advancing the baseline is what stops a read-only gate becoming a
      # ratchet. Without this, a cycle publishing inside its cap still leaves
      # the new URLs unaccepted, and they accumulate until the cap is crossed
      # and the gate stays red permanently with no over-publishing behind it.
      # This step is reachable only after the gate above has passed, so the cap
      # still binds: an over-cap cycle fails before it can accept itself.
      - name: Accept the cleared cycle into the cadence baseline
        run: |
          npm run cadence:accept -- --reason "Daily governed authority cycle for $(date -u +%F), run ${{ github.run_id }}. The cadence gate cleared before this step, so these pages are inside the weekly publication cap."

      - name: Commit governed changes if any
        run: |
          git config user.name "pnp-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No governed authority changes to commit."
          else
            git commit -m "chore: run governed authority cycle"
            git push
          fi
