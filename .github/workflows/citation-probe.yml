name: Paid Citation Probe

# Paid lane, off by owner policy (11 Oct 2026: "nothing should be paid").
# It asks a paid model with the OpenRouter web plugin (billed per web result)
# whether answer engines cite this site. It used to run every day inside
# authority-daily.yml; it now has no schedule and runs only when a human
# dispatches it with confirm_paid=true. Any other dispatch is a named stop.
# Guarded by scripts/llm/validate_zero_paid_llm.mjs (npm run validate:zero-paid-llm).

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: "This run costs money (paid model + per-result web search). Must be true to run."
        type: boolean
        default: false
      limit:
        description: "Number of queries to ask"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: pnp-authority-daily
  cancel-in-progress: false

jobs:
  citation-probe:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless confirm_paid (named stop)
        if: ${{ !inputs.confirm_paid }}
        run: echo "NAMED STOP PAID_LANE_REFUSED - the citation probe is disabled by owner policy (11 Oct 2026). Re-dispatch with confirm_paid=true to run it once."

      - name: Checkout
        if: ${{ inputs.confirm_paid }}
        uses: actions/checkout@v7

      - name: Set up Node
        if: ${{ inputs.confirm_paid }}
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Observe whether answer engines cite us
        if: ${{ inputs.confirm_paid }}
        env:
          CONFIRM_PAID: ${{ inputs.confirm_paid }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
          PROBE_LIMIT: ${{ inputs.limit }}
        run: node scripts/llm_citation_probe.mjs --limit "$PROBE_LIMIT"

      - name: Commit the observation
        if: ${{ inputs.confirm_paid }}
        run: |
          git config user.name "pnp-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals/llm_citation_observations.json
          if git diff --cached --quiet; then
            echo "No observation to commit."
          else
            git commit -m "chore: record dispatched citation probe"
            git pull --rebase
            git push
          fi
