name: Deploy Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made by a workflow using the default GITHUB_TOKEN does not raise a
  # `push` event. That is a GitHub rule, not a misconfiguration, and it made the
  # `push` trigger above unreachable for every commit this repo actually
  # automates: authority-daily.yml commits the governed cycle and the measured
  # Search Console evidence, self-heal.yml commits validated repairs, and all of
  # them push as pnp-authority-bot / github-actions[bot] with GITHUB_TOKEN.
  #
  # Confirmed on this repository, not assumed: `gh run list --commit <sha>`
  # returns an empty list for every bot commit on main - 5489eb1, 279d4927,
  # c61dc79 (chore: run governed authority cycle) and 21f5d7ad (chore: ingest
  # measured Search Console demand). Zero workflow runs on four commits that each
  # changed published pages.
  #
  # This lane is the only caller of distribution_scripts/deploy_distribution.sh,
  # which is what performs IndexNow submission, sitemap submission and GSC URL
  # inspection. So every page the daily cycle published was committed and then
  # never announced to any search or answer engine, while the run log for the
  # publishing workflow read green. workflow_run keys on a workflow completing
  # rather than on a push, so it fires for bot commits.
  workflow_run:
  # "Search Intelligence Cycle" is here for the same reason, and it was found by
  # the validator rather than by reading: it pushes too, under commit_evidence,
  # and what it commits includes the observed surfacing ledger and the citation
  # yield observations that the atlas and the yield scoreboard are built from.
  workflow_run:
    workflows:
      ["Daily Authority Cycle", "Bounded Self-Healing", "Search Intelligence Cycle"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pnp-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-distribute:
    # Distribute on a push or a dispatch as before; on a workflow_run, only when
    # the upstream cycle actually succeeded. There is no point announcing pages
    # to IndexNow that a failed publishing run never finished writing.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Python and the GSC client are here for the distribution step's URL
      # inspection. The credential file written below is the one that step reads.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional GSC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      # Written outside the workspace on purpose: a service-account key at the
      # repository root is one stray `git add` or one deploy-directory copy away
      # from being published, and validate:tree-hygiene correctly fails the run
      # when it appears there - which is exactly how this surfaced.
      - name: Recreate GSC service account when configured
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gsc-service-account.json"
            chmod 600 "$RUNNER_TEMP/gsc-service-account.json"
          fi

      # The Search Console ingest used to run here. It worked - one run measured 19
      # real T1 queries - but this job declares `permissions: contents: read` and has
      # no commit step, so every measured row was discarded when the job ended and
      # the checked-in evidence never moved off three modelled Semrush rows. Running
      # a measurement whose result is guaranteed to be thrown away is worse than not
      # running it, because the log makes it look like the loop is closed.
      #
      # The ingest now lives in authority-daily.yml, which has contents: write and
      # commits. What belongs here instead is the gate: prove the committed atlas is
      # the one this evidence actually produces, so a deploy can never distribute a
      # stale or hand-edited atlas.
      - name: Prove the committed query atlas matches its evidence
        run: |
          npm run atlas:build
          if ! git diff --exit-code -- data/authority_scale/query_atlas.json; then
            echo "::error::data/authority_scale/query_atlas.json is stale or hand-edited: rebuilding it from data/queries/evidence/evidence_queries.json produces a different file. Run 'npm run atlas:build' and commit the result."
            exit 1
          fi

      - name: Build validated distribution inputs
        run: |
          npm run authority:improvements:build
          npm run authority:yield:build
          npm run build:sitemap
          npm run authority:scale:admit
          npm run authority:scale:freeze
          npm run authority:territories:build
          npm run distribution:prepare
          npm run validate:query-atlas
          npm run validate:release

      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        #
        # The integrity check runs first and is not optional: the gate used to
        # rewrite the ledger it reads, so a blocked run cleared itself on the
        # next invocation. A gate that cannot hold a verdict reports a status
        # without enforcing anything.
        run: |
          npm run validate:cadence-integrity
          npm run cadence:gate
          npm run cadence:template-share
      - name: Run validated distribution
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          chmod +x distribution_scripts/*.sh distribution_scripts/*.py
          args=(--host porchandparty901.com --artifact-dir .build)
          if [ -s "$RUNNER_TEMP/gsc-service-account.json" ] && [ -n "$GSC_SITE_URL" ]; then
            args+=(--creds "$RUNNER_TEMP/gsc-service-account.json" --gsc-site "$GSC_SITE_URL")
          fi
          ./distribution_scripts/deploy_distribution.sh "${args[@]}"

      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnp-distribution-evidence-${{ github.run_id }}
          path: |
            .build/distribution-manifest.json
            .build/distribution-receipt.json
            .build/inspection-results.json
          if-no-files-found: warn
