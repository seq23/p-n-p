name: Search Loop

# The shared search growth engine (seq23/search-loop), owner ruling 1 Nov 2026:
# find easy local searches weekly, publish one gated question page per search
# daily under /questions/ on porchandparty901.com (straight away, no approval),
# every page ending in the quote request (/request), check each page at 2/4/8
# weeks, strengthen / undo / merge, and upload the weekly report artifact
# "search-loop-week". $0 only: free model lanes, no paid route. The global switch
# SEARCH_LOOP_MODE on seq23/search-loop (normal | slow | off) throttles it without
# touching this repo. Engine pages sit outside data/cadence/policy.json's weekly
# cap (scripts/cadence/sitemap_urls.js); the post-build folds them into the site.
on:
  schedule:
    - cron: "29 7 * * *"  # America/Chicago, all year
      timezone: America/Chicago
  # A change to the engine's config or routing is checked on the PR (search-loop v1.12.0
  # stage validate: config + model-routing checks only, no network, no model call; peace-be-still
  # 18 Nov 2026 failed every scheduled run on a routing file nothing checked before merge).
  pull_request:
    paths:
      - search-loop.config.json
      - .github/workflows/search-loop.yml
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('search-loop-pr-{0}', github.ref) || 'search-loop' }}
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@56a1b11eb0262dd00dd4c379db7ff45dfebde4b6
    with:
      open_loops_business: porch-and-party
      engine_ref: v1
      stage: ${{ github.event_name == 'pull_request' && 'validate' || inputs.stage || 'auto' }}
      setup_command: npm ci
      post_build_command: bash .github/scripts/search_loop_post_build.sh
