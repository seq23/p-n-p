name: Search Loop

# The shared search growth engine (seq23/search-loop), owner ruling 1 Nov 2026:
# find easy local searches weekly, publish one gated question page per search
# daily under /questions/ on porchandparty901.com (straight away, no approval),
# every page ending in the quote request (/request), check each page at 2/4/8
# weeks, strengthen / undo / merge, and upload the weekly report artifact
# "search-loop-week". $0 only: free model lanes, no paid route. The global switch
# SEARCH_LOOP_MODE on seq23/search-loop (normal | slow | off) throttles it without
# touching this repo. Engine pages sit outside data/cadence/policy.json's weekly
# cap (scripts/cadence/sitemap_urls.js); the post-build folds them into the site.
on:
  schedule:
    - cron: "29 7 * * *"  # America/Chicago, all year
      timezone: America/Chicago
  # TEMPORARY proof-run trigger (removed before merge): a branch run builds, gates and
  # uploads the pages without committing.
  push:
    branches: [search-loop-adopt]
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: search-loop
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: npm ci
      post_build_command: bash .github/scripts/search_loop_post_build.sh
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
