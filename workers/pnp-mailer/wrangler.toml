# Private mail sender for the porchandparty901.com admin console. Pages Functions
# cannot hold a send_email binding, so the p-n-p Pages project reaches this Worker
# through a service binding (MAILER). No route, no workers.dev URL: nothing on the
# internet can call it. Deploy: npm run mailer:deploy
name = "pnp-mailer"
main = "src/index.js"
compatibility_date = "2026-03-22"
workers_dev = false
preview_urls = false

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@porchandparty901.com"]

# Day-before reminders (functions/_lib/reminders.mjs): 10 AM America/Chicago all year. Two UTC
# crons because of daylight saving; the handler runs only the one that is 10 AM in Memphis.
[triggers]
crons = ["0 15 * * *", "0 16 * * *"]

# The admin console's database: reminders read tomorrow's bookings and record email_reminded_at.
[[d1_databases]]
binding = "DB"
database_name = "pnp-admin"
database_id = "a78e157d-177d-44a0-9418-dcfa6e735bd0"
