# Private mail sender for the porchandparty901.com admin console. Pages Functions
# cannot hold a send_email binding, so the p-n-p Pages project reaches this Worker
# through a service binding (MAILER). No route, no workers.dev URL: nothing on the
# internet can call it. Deploy: npm run mailer:deploy
name = "pnp-mailer"
main = "src/index.js"
compatibility_date = "2026-03-22"
workers_dev = false
preview_urls = false

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@porchandparty901.com"]

# Every hour on the hour (UTC): rental hold expiry and hold reminders. The daily work (day-before
# reminders, thank-you emails, sheet resync) runs only in the run that is 10 AM America/Chicago:
# 15:00 UTC in daylight time (CDT, UTC-5), 16:00 UTC in standard time (CST, UTC-6). Valerie's
# daily to-do email (Mondays with "Your week") goes in the run that is 7 AM America/Chicago:
# 12:00 UTC (CDT) or 13:00 UTC (CST), so daylight saving needs no change here either.
[triggers]
crons = ["0 * * * *"]

# The admin console's database: reminders read tomorrow's bookings and record email_reminded_at.
[[d1_databases]]
binding = "DB"
database_name = "pnp-admin"
database_id = "a78e157d-177d-44a0-9418-dcfa6e735bd0"

# The private ID-photo bucket (same as the Pages project's IDS): the hourly run deletes each
# website-form ID 90 days after it is ready (functions/_lib/id-auto.mjs, migration 0022).
# Google-form IDs live in Drive and are never touched.
[[r2_buckets]]
binding = "IDS"
bucket_name = "pnp-ids"

# Raw outreach mail stays private, in the existing R2 bucket, under outreach/raw/.
[[r2_buckets]]
binding = "OUTREACH_RAW"
bucket_name = "pnp-ids"
